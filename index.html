<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <div class="couple-profiles">
            <div class="profile">
                <img id="foto1" src="" alt="Pihak 1">
                <h2 id="nama1"></h2>
                <p id="kota1"></p>
            </div>
            <div class="heart">🤍</div>
            <div class="profile">
                <img id="foto2" src="" alt="Pihak 2">
                <h2 id="nama2"></h2>
                <p id="kota2"></p>
            </div>
        </div>
    </header>

    <section class="playlist-section">
        <h3>Soundtrack Kita</h3>
        <div id="playlist-container">   
            <!-- Rendered by JS -->
        </div>
    </section>

    <section class="countdown-section">
        <h3>Menunggu Hari Bertemu</h3>
        <p id="lokasi-ketemu" class="location-text"></p>
        <div class="timer" id="countdown-timer">
            <div class="time-box"><span id="hari">0</span><p>Hari</p></div>
            <div class="time-box"><span id="jam">0</span><p>Jam</p></div>
            <div class="time-box"><span id="menit">0</span><p>Menit</p></div>
            <div class="time-box"><span id="detik">0</span><p>Detik</p></div>
        </div>
    </section>

    <section class="timeline-section">
        <h3>Jejak Waktu Kita</h3>
        <div class="timeline-container" id="timeline-container">
            <!-- Rendered by JS -->
        </div>
    </section>

    <section class="open-when-section">
        <h3>Open When...</h3>
        <div class="cards-container" id="open-when-container">
            <!-- Rendered by JS -->
        </div>
    </section>

    <section class="gallery-section">
        <h3>Galeri Kenangan</h3>
        <div class="gallery-grid" id="gallery-container">
            <!-- Rendered by JS -->
        </div>
    </section>

    <footer>
        <p>Made with love for us.</p>
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
